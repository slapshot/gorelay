name: Normalize Go source (temporary)
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'slapshot/gorelay' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Normalize source and modules
        run: |
          go mod tidy
          gofmt -w cmd internal examples
      - name: Commit normalization
        run: |
          git add -- go.mod go.sum cmd internal examples
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt worker and delivery code'
            git push origin HEAD:dev
          fi

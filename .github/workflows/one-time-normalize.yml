name: One-time Go normalization

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'slapshot/gorelay' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Generate checksums and format Go source
        run: |
          go mod tidy
          gofmt -w cmd internal
      - name: Commit generated lockfile and formatting to dev
        run: |
          git add -- go.mod go.sum cmd internal
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: gofmt and pin Go module checksums"
            git push origin HEAD:dev
          else
            echo 'Already normalized'
          fi
